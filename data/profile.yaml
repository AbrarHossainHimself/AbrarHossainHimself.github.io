bio: |
  I am a PhD candidate in Computer Science at the **University of Toledo**, working on **autotuning, compiler optimization (MLIR), and instrumentation** for high-performance computing. My earlier Master's research focused on **power- and cost-aware HPC scheduling**. I have worked as an intern and visitor at **NCSA** and **NSF NCAR**, building network monitoring and community-scale IoT data systems. I serve as an **NSF ACCESS Student Champion** and received the **SGX3 Rising Star of the Year Award (2025)**.
