intro: "I work on making high-performance systems faster, easier to optimize, and more predictable."

current:
  - title: "Autotuning & compiler optimization"
    body: "I work on learning-based autotuning for compilers and HPC systems, including reinforcement learning for MLIR loop transformations (LoopRL), transfer-aware Bayesian optimization, and bandit-based tuning for edge devices (LASP). I also study autotuning techniques across the HPC stack."

  - title: "Instrumentation & performance analysis"
    body: "I work on performance analysis of modern accelerators, focusing on dynamic instrumentation for dataflow architectures and congestion-aware GPU warp scheduling."

  - title: "Reliable performance prediction"
    body: "I work on risk-controlled multi-fidelity conformal prediction to improve the reliability of performance estimates using measurements with varying costs and accuracy."

past:
  label: "Master's research"
  items:
    - title: "Power- and cost-aware HPC scheduling"
      body: "I worked on power-aware HPC scheduling using graph neural networks (TARDIS), electricity cost optimization across HPC centers, auction-based network resource allocation, and scalable scheduling simulation using SST."
